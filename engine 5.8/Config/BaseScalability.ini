; The Domain — scalability presets
; Min spec: RTX 2060 / Ryzen 5 3600 / 16GB RAM
; See: docs/adr/ADR-002-graphics-fidelity-tier.md

[MinSpec@0]
r.Nanite=1
r.DynamicGlobalIlluminationMethod=1
r.Lumen.Reflections.HardwareRayTracing=0
r.RayTracing.Reflections=1
r.RayTracing.Shadows=1
r.TemporalAA.Upsampling=1
sg.ResolutionQuality=75
r.Streaming.PoolSize=512
r.Nanite.Streaming.PoolSize=512

[HighSpec@2]
r.Nanite=1
r.DynamicGlobalIlluminationMethod=2
r.Lumen.Reflections.HardwareRayTracing=1
r.RayTracing.Reflections=1
r.RayTracing.Shadows=1
r.TemporalAA.Upsampling=1
sg.ResolutionQuality=100
r.Streaming.PoolSize=1024
r.Nanite.Streaming.PoolSize=1024

[Ultra@3]
r.PathTracing=1
r.Nanite=1
r.DynamicGlobalIlluminationMethod=2
r.Lumen.Reflections.HardwareRayTracing=1
sg.ResolutionQuality=100
r.Streaming.PoolSize=2048
r.Nanite.Streaming.PoolSize=2048
