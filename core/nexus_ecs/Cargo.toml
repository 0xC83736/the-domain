[package]
name        = "nexus_ecs"
description = "Archetype-based ECS world — the central data model for The Domain"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
# staticlib  → produces .lib (Win64) / .a (Mac/Linux) for UE to link against
# rlib       → keeps Rust-to-Rust linkage for the rest of the workspace
crate-type = ["staticlib", "rlib"]

[dependencies]
glam.workspace      = true
parking_lot.workspace = true
rayon.workspace     = true
tracing.workspace   = true
thiserror.workspace = true
bytemuck.workspace  = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name    = "ecs_bench"
harness = false
